[project]
name = "discrete-calculator"
version = "0.1.0"
description = ""
authors = [
    {name = "Roland Radionov",email = "rolandradionov@gmail.com"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "rich (>=15.0.0,<16.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]